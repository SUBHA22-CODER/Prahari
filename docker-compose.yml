version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: prahari_db
    environment:
      POSTGRES_USER: prahari
      POSTGRES_PASSWORD: prahari_pass
      POSTGRES_DB: prahari_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prahari -d prahari_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend + APScheduler ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prahari_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://prahari:prahari_pass@db:5432/prahari_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── React + Leaflet Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prahari_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pg_data:
